[package]
name = "retype-cli"
description = "Command line client and daemon for retype"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "retype_cli"
path = "src/lib.rs"

[[bin]]
name = "retype"
path = "src/main.rs"

[dependencies]
clap.workspace = true
getrandom.workspace = true
retype-core = { path = "../retype-core" }
retype-ipc = { path = "../retype-ipc" }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_System_IO",
	"Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
