# The registry the product ships, `docs/operations.md` and `docs/config.md`.
#
# Keys are permanent: a key is never reused for a different meaning, so renaming
# a key is a breaking change and removing one leaves a hole that cannot be
# filled. Names and aliases occupy one name space with presets, and a name that
# is a prefix of another is resolved by the longer match, which is why `q` and
# `quality` can coexist.
#
# An operation with an empty `formats` list is one whose vertical has not landed
# yet: it is named so that using it is `E_UNSUPPORTED` rather than
# `E_NAME_UNKNOWN`, `docs/operations.md` §6.
#
# An exclusive group with a single member is not declared, because a group of one
# cannot conflict; `docs/config.md` V8 makes that an error for the same reason.
#
# `say` is how the operation reads in a sentence, `docs/cli.md` §3: a template with
# `{value}` where the parameter goes, and nothing else. It is the operation's name
# spelled for a person rather than for the grammar, so `cap to 1080` and
# `rotate 90 degrees` are the strings the product shows.
#
# An operation with no `argv` fragment for any tool is declared but unusable: the
# planner reports it as unsupported. Fragments land with a vertical, and only for
# flags whose behaviour matches `docs/operations.md`; the geometry ones below were
# measured against ImageMagick 7.1.2.

version = 'retype-config-1'

# Presets are macros over tokens, `docs/config.md` §7. They join the operation
# name space, expand where they stand, and are checked by the same duplicate and
# exclusivity rules, so a preset cannot smuggle in a conflict.
#
# Only presets whose operations all have a fragment are shipped: a shipped preset
# that cannot run is a broken promise, unlike an operation whose vertical has not
# landed, which `explain` reports as unsupported.

[presets.thumbnail]
param = { class = 'int', min = 16, max = 4096 }
tokens = ['cap={value}', 'quality85']

# External tools, `docs/tools.md`. The layout is the argv template: `{input}`
# and `{output}` are paths and `{ops}` is where a format's fragment expands, so
# a tool that wants its output before its input says so here rather than in
# code. `components` are the substrings the probe output has to mention, because
# a tool can be installed and still be built without the delegate it needs.

# Backend preference, `docs/config.md` §8. The first entry that carries every
# operation of an output and is usable wins, so the order here is the product's
# opinion about which encoder to prefer, not what happens to be installed.
[backends]
prefer = ['magick', 'ffmpeg', 'pandoc', '7zz']

# How `retype bench` makes its samples, `docs/config.md` §15. A sample is generated
# once per family, in the format named by `[bench.seed]`, by the first tool below
# that is installed; the pair is then measured from that sample. The argv is a
# tool's own way of drawing something, so it lives here rather than in Rust.
[bench.seed]
image = 'jpg'
video = 'mp4'
audio = 'mp3'

# A photograph-like gradient rather than a flat colour, because a flat image
# compresses to nothing and the size ratio a benchmark reports would be a lie.
[bench.sample.image.magick]
args = ['-size', '2400x1600', '-seed', '0', 'plasma:fractal', '{output}']

# Five seconds of 720p at 30 fps, which is a short clip but enough for the encoder
# to do real work and for the measurement to be about encoding rather than startup.
# With a tone, because a video without audio cannot measure a video-to-audio pair.
[bench.sample.video.ffmpeg]
args = ['-f', 'lavfi', '-i', 'testsrc2=size=1280x720:rate=30:duration=5', '-f', 'lavfi', '-i', 'sine=frequency=440:duration=5', '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '{output}']

# A tone rather than silence, because silence compresses and a tone does not.
[bench.sample.audio.ffmpeg]
args = ['-f', 'lavfi', '-i', 'sine=frequency=440:duration=30', '{output}']

[tools.magick]
command = 'magick'
probe = ['-version']
version_min = '7.1'
purpose = 'image conversion'
components = ['heic', 'webp']
families = ['image']
layout = ['{input}', '{ops}', '{output}']

[tools.ffmpeg]
command = 'ffmpeg'
probe = ['-version']
version_min = '6.0'
purpose = 'audio and video conversion'
families = ['video', 'audio']
layout = ['-y', '-i', '{input}', '{ops}', '{output}']

[tools.pandoc]
command = 'pandoc'
probe = ['--version']
version_min = '3.0'
purpose = 'document conversion'
families = ['document']
layout = ['{input}', '{ops}', '-o', '{output}']
engines = { pdf = ['typst', 'xelatex', 'lualatex', 'pdflatex', 'weasyprint', 'wkhtmltopdf'] }

# Only `.7z` uses this. `zip`, `tar` and the compression codecs are native,
# `docs/tools.md` §7. The executable has three official names: `7zz` for the
# console build we manage, and `7z` or `7za` where the platform ships those.
[tools.7zz]
command = '7zz'
aliases = ['7z', '7za']
probe = ['i']
version_min = '23.0'
purpose = '7z archives'
families = ['archive']
layout = ['a', '-y', '{ops}', '{output}', '{input}']

[formats.jpg]
family = 'image'
lossy = true
alpha = false
tier = 'converted'
aliases = ['jpeg', 'jpe']

[formats.png]
family = 'image'
lossy = false
alpha = true
tier = 'converted'
aliases = []

[formats.webp]
family = 'image'
lossy = true
alpha = true
tier = 'converted'
aliases = []

[formats.avif]
family = 'image'
lossy = true
alpha = true
tier = 'converted'
aliases = []

[formats.heic]
family = 'image'
lossy = true
alpha = true
tier = 'converted'
aliases = ['heif']

[formats.gif]
family = 'image'
lossy = false
alpha = true
tier = 'converted'
aliases = []

[formats.tiff]
family = 'image'
lossy = false
alpha = true
tier = 'converted'
aliases = ['tif']

[formats.bmp]
family = 'image'
lossy = false
alpha = false
tier = 'converted'
aliases = []

[formats.ico]
family = 'image'
lossy = false
alpha = true
tier = 'converted'
aliases = []

# Video and audio, `docs/operations.md`. The format fragment names the codecs the
# container holds, because ffmpeg needs to be told what to encode rather than
# inferring from the extension. `-vn` on an audio target is what makes extracting
# the sound from a clip a conversion rather than an error.
[formats.mp4]
family = 'video'
lossy = true
alpha = false
tier = 'converted'
argv.ffmpeg = { args = ['-c:v', 'libx264', '-c:a', 'aac', '-movflags', '+faststart'] }

[formats.webm]
family = 'video'
lossy = true
alpha = false
tier = 'converted'
argv.ffmpeg = { args = ['-c:v', 'libvpx-vp9', '-c:a', 'libopus'] }

[formats.mkv]
family = 'video'
lossy = true
alpha = false
tier = 'converted'
argv.ffmpeg = { args = ['-c:v', 'libx264', '-c:a', 'aac'] }

[formats.mov]
family = 'video'
lossy = true
alpha = false
tier = 'converted'
aliases = ['qt']
argv.ffmpeg = { args = ['-c:v', 'libx264', '-c:a', 'aac', '-movflags', '+faststart'] }

[formats.mp3]
family = 'audio'
lossy = true
alpha = false
tier = 'converted'
argv.ffmpeg = { args = ['-vn', '-c:a', 'libmp3lame'] }

[formats.m4a]
family = 'audio'
lossy = true
alpha = false
tier = 'converted'
argv.ffmpeg = { args = ['-vn', '-c:a', 'aac'] }

[formats.flac]
family = 'audio'
lossy = false
alpha = false
tier = 'converted'
argv.ffmpeg = { args = ['-vn', '-c:a', 'flac'] }

[formats.wav]
family = 'audio'
lossy = false
alpha = false
tier = 'converted'
argv.ffmpeg = { args = ['-vn', '-c:a', 'pcm_s16le'] }

# Documents, `docs/tools.md` §5. `pandoc` reads and writes all of these, and the
# PDF engine is resolved rather than fixed, so the same intent on two machines is
# two documents and the engine is recorded with the job.
#
# `md` is both a source and a target: `notes.md` to `notes.docx` is the gesture the
# product exists for, and `notes.docx` back to `notes.md` is the same gesture in
# reverse.
[formats.md]
family = 'document'
lossy = false
alpha = false
tier = 'converted'
aliases = ['markdown']

# `--standalone` is what makes the output a document rather than a fragment: a
# body without a head is not an HTML file anyone can open.
[formats.html]
family = 'document'
lossy = false
alpha = false
tier = 'converted'

[formats.html.argv.pandoc]
args = ['--standalone']

[formats.docx]
family = 'document'
lossy = false
alpha = false
tier = 'converted'

[formats.odt]
family = 'document'
lossy = false
alpha = false
tier = 'converted'

[formats.epub]
family = 'document'
lossy = false
alpha = false
tier = 'converted'

# Written and never read: pandoc has no PDF reader, so `pdf` as a source is a
# promise to fail. `docs/tools.md` §5 says the output is web-grade or TeX-grade
# depending on the engine, which is why it is `converted` and never `exact`.
[formats.pdf]
family = 'document'
direction = 'encode'
lossy = false
alpha = false
tier = 'converted'

[formats.pdf.argv.pandoc]
args = ['--pdf-engine', '{engine.pdf}']

# Archives, `docs/tools.md` §7. These are containers, and converting one into
# another is a conversion: the entries keep their names, their bytes and their
# permissions, and only the container changes. That is why they are `exact` and why
# this build does them itself rather than handing a format's quirks to another
# process.
#
# A container is repacked from another container. A directory is not a source and a
# bare file is not compressed on its own: `foo.zip` to `foo.7z` is the conversion,
# and it is one no file manager offers.
[formats.zip]
family = 'archive'
native = 'zip'
lossy = false
alpha = false
tier = 'exact'

[formats.tar]
family = 'archive'
native = 'tar'
lossy = false
alpha = false
tier = 'exact'

# Quoted, because this is the spelling that means what it says. An unquoted
# `[formats.tar.gz]` is TOML for `gz` inside `tar`, which the loader restores to the
# same format, `docs/config.md` §4; the shipped file writes the unambiguous form.
[formats."tar.gz"]
family = 'archive'
native = 'tar.gz'
lossy = false
alpha = false
tier = 'exact'

[ops.quality]
aliases = ['q']
slot = 50
exclusive = ['encode-target']
formats = ['jpg', 'webp', 'avif', 'heic']
param = { class = 'int', min = 1, max = 100 }
say = 'quality at {value}'

[ops.quality.argv.magick]
args = ['-quality', '{value}']
[ops.lossless]
slot = 50
exclusive = ['encode-target']
formats = ['webp', 'avif', 'heic']
say = 'without loss'

[ops.size]
slot = 50
exclusive = ['encode-target']
formats = ['jpg', 'png', 'webp', 'avif', 'heic']
param = { class = 'size', min = 1 }
say = 'at most {value}'

[ops.effort]
slot = 50
formats = ['webp', 'avif']
param = { class = 'int', min = 0, max = 10 }
say = 'effort {value}'

[ops.compress]
slot = 50
formats = ['png', 'tiff']
param = { class = 'int', min = 0, max = 9 }
say = 'compression level {value}'

[ops.colors]
slot = 50
formats = ['png', 'gif']
param = { class = 'int', min = 2, max = 256 }
say = '{value} colours'

[ops.cap]
slot = 28
exclusive = ['scale']
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico', 'mp4', 'webm', 'mkv', 'mov']
param = { class = 'int', min = 16, max = 16384 }
say = 'cap to {value}'

[ops.cap.argv.magick]
args = ['-filter', 'Lanczos', '-resize', '{value}x{value}>']
[ops.cap.argv.ffmpeg]
args = ['-vf', 'scale={value}:{value}:force_original_aspect_ratio=decrease']
[ops.resize]
slot = 25
exclusive = ['scale']
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
param = { class = 'dim', min = 1, max = 16384 }
say = 'resize to {value}'

[ops.resize.argv.magick]
args = ['-filter', 'Lanczos', '-resize', '{value}>']
[ops.width]
aliases = ['w']
slot = 26
exclusive = ['scale']
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
param = { class = 'int', min = 16, max = 16384 }
say = 'width {value}'

[ops.width.argv.magick]
args = ['-filter', 'Lanczos', '-resize', '{value}x>']
[ops.height]
aliases = ['h']
slot = 27
exclusive = ['scale']
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
param = { class = 'int', min = 16, max = 16384 }
say = 'height {value}'

[ops.height.argv.magick]
args = ['-filter', 'Lanczos', '-resize', 'x{value}>']
[ops.crop]
slot = 24
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
param = { class = 'ratio', min = 1, max = 1000 }
say = 'crop to {value}'

[ops.rotate]
slot = 21
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
param = { class = 'enum', values = ['90', '180', '270'] }
say = 'rotate {value} degrees'

[ops.rotate.argv.magick]
args = ['-rotate', '{value}']
[ops.fliph]
slot = 22
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
say = 'flip horizontally'

[ops.fliph.argv.magick]
args = ['-flop']
[ops.flipv]
slot = 23
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
say = 'flip vertically'

[ops.flipv.argv.magick]
args = ['-flip']
[ops.gray]
aliases = ['grey', 'grayscale']
slot = 30
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'bmp', 'ico']
say = 'convert to greyscale'

[ops.nometa]
slot = 60
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'ico']
say = 'strip metadata'

[ops.noprofile]
slot = 60
formats = ['jpg', 'png', 'webp', 'avif', 'heic', 'gif', 'tiff', 'ico']
say = 'strip the colour profile'

[ops.ask]
slot = 90
exclusive = ['confirm']
formats = ['*']
say = 'ask first'

[ops.now]
slot = 90
exclusive = ['confirm']
formats = ['*']
say = 'do it now'

[ops.trim]
slot = 10
formats = []
param = { class = 'range', scalar = 'time' }
say = 'keep only {value}'

[ops.at]
slot = 10
formats = ['mp4', 'webm', 'mkv', 'mov', 'mp3', 'm4a', 'flac', 'wav']
param = { class = 'time' }
say = 'starting at {value}'

# After `-i` rather than before it: seeking by keyframe is faster and lands on the
# wrong second, and a clip that starts late is worse than one that starts slowly.
[ops.at.argv.ffmpeg]
args = ['-ss', '{value}']

[ops.speed]
slot = 10
formats = []
param = { class = 'int', min = 1, max = 400 }
say = 'speed at {value} percent'

[ops.fps]
slot = 10
formats = ['mp4', 'webm', 'mkv', 'mov']
param = { class = 'int', min = 1, max = 240 }
say = '{value} frames per second'

[ops.fps.argv.ffmpeg]
args = ['-r', '{value}']

[ops.mute]
slot = 40
formats = ['mp4', 'webm', 'mkv', 'mov']
say = 'remove the audio'

[ops.mute.argv.ffmpeg]
args = ['-an']

[ops.normalize]
slot = 40
formats = []
say = 'normalise loudness'

[ops.mono]
slot = 40
formats = []
say = 'mix down to mono'

[ops.bitrate]
slot = 40
formats = []
param = { class = 'int', min = 1 }
say = 'bitrate {value}'

[ops.codec]
slot = 40
formats = []
param = { class = 'enum', values = [] }
say = 'codec {value}'

[ops.page]
slot = 10
formats = []
param = { class = 'range' }
say = 'pages {value}'

[ops.dpi]
aliases = ['d']
slot = 10
formats = []
param = { class = 'int', min = 36, max = 1200 }
say = 'resolution {value} dpi'
