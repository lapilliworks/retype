[workspace]
members = [
	"crates/retype-core",
	"crates/retype-watch",
	"crates/retype-ipc",
	"crates/retype-macros",
	"crates/retype-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "ISC"
repository = "https://github.com/justretype/retype"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
thiserror = "2.0"
toml = "1.0"

[workspace.lints.clippy]
tabs_in_doc_comments = "allow"
