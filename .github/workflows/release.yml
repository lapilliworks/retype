name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          name="retype-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "dist/$name/bin" "dist/$name/share/retype"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/retype.exe" "dist/$name/bin/retype.exe"
          else
            cp "target/${{ matrix.target }}/release/retype" "dist/$name/bin/retype"
          fi
          if [ -f fidelity.toml ]; then
            cp fidelity.toml "dist/$name/share/retype/fidelity.toml"
          fi
          if [ -d fixtures/fidelity ]; then
            mkdir -p "dist/$name/share/retype/fixtures/fidelity"
            cp -R fixtures/fidelity/. "dist/$name/share/retype/fixtures/fidelity/"
          fi
          cp -R packaging "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for file in *.tar.gz; do
            sha256sum "$file" > "$file.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  lint:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
