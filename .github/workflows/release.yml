name: release

on:
  push:
    branches: ['ci/native-platform-20261107']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          [ -n "$version" ] || { echo 'no workspace version in Cargo.toml' >&2; exit 1; }
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
            exit 1
          }

  native:
    name: native verification
    uses: ./.github/workflows/native.yml

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build: container
            container: rust:1.85-bullseye
            binary: retype
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build: container
            container: rust:1.85-bullseye
            binary: retype
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            build: cargo
            binary: retype
          - runner: macos-15
            target: aarch64-apple-darwin
            build: cargo
            binary: retype
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            build: cargo
            binary: retype.exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            build: cargo
            binary: retype.exe
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$GITHUB_REF_NAME
            release=true
          else
            version=dev-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
            release=false
          fi
          printf 'version=%s\nrelease=%s\n' "$version" "$release" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build == 'cargo'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: matrix.build == 'cargo'

      - name: Build (Linux, glibc 2.31)
        if: matrix.build == 'container'
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/target/dist"
          mkdir -p "$out"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env CARGO_HOME=/tmp/cargo \
            --env CARGO_TARGET_DIR=/tmp/target \
            --volume "$PWD:/src:ro" \
            --volume "$out:/out" \
            --workdir /src \
            "${{ matrix.container }}" \
            bash -c 'cargo build --release --locked -p retype-cli --bin retype && cp /tmp/target/release/retype /out/retype'
          "$out/retype" --version

      - name: Build
        if: matrix.build == 'cargo'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          cargo build --release --locked -p retype-cli --bin retype --target "${{ matrix.target }}"
          if [ "${{ matrix.target }}" != 'aarch64-pc-windows-msvc' ]; then
            "$binary" --version
          fi

      - name: Assemble
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="retype-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$name/bin" "dist/$name/share/retype"
          if [ "${{ matrix.build }}" = 'container' ]; then
            cp target/dist/retype "dist/$name/bin/retype"
          else
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/bin/${{ matrix.binary }}"
          fi
          # Earned by `retype fidelity --write share/retype/fidelity.toml`, and
          # checked in, so every archive ships the same claims the release notes
          # describe. Absent until the first release run.
          if [ -f share/retype/fidelity.toml ]; then
            cp share/retype/fidelity.toml "dist/$name/share/retype/fidelity.toml"
          fi
          if [ -d fixtures/fidelity ]; then
            mkdir -p "dist/$name/share/retype/fixtures/fidelity"
            cp -R fixtures/fidelity/. "dist/$name/share/retype/fixtures/fidelity/"
          fi
          cp -R packaging "dist/$name/share/retype/packaging"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for file in *.tar.gz; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Attest build provenance
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: retype-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash -n packaging/install.sh
      - run: bash scripts/test-install.sh
      - run: timeout --kill-after=5s 30s bash scripts/test-assemble-release.sh
      - run: test -s packaging/install.ps1
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'packaging/install.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

  package:
    name: assemble release assets
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: retype-*
          path: dist
          merge-multiple: true
      - name: Verify and assemble release assets
        run: bash scripts/assemble-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/install.sh
            dist/install.ps1
            dist/install.sh.sha256
            dist/install.ps1.sha256
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, package, checks, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify release assets
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=''
          case "$TAG" in *-*) prerelease='--prerelease' ;; esac
          assets=(dist/*.tar.gz dist/*.tar.gz.sha256 dist/install.sh dist/install.ps1
            dist/install.sh.sha256 dist/install.ps1.sha256 dist/SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --generate-notes $prerelease
          fi
