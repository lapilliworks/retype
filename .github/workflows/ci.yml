name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cross:
    name: cross check (typecheck foreign targets)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [
          x86_64-pc-windows-msvc,
          aarch64-pc-windows-msvc,
          aarch64-unknown-linux-gnu,
          aarch64-apple-darwin,
          x86_64-unknown-freebsd,
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --all-targets --target ${{ matrix.target }}

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n packaging/install.sh
      - run: bash scripts/test-install.sh
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'packaging/install.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }

  site:
    name: site checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node sites/lib/checks.mjs
      # The bundle is what deploys, so a docs build that breaks fails here rather
      # than at the first push to the default branch.
      - name: Build the bundle
        env:
          SITE_RUNTIME: docker
        run: sites/bin/bundle.sh

  probe:
    name: event probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe
        shell: bash
        run: |
          set -o pipefail
          cargo run -q -p retype-watch --example probe_events | tee "probe-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: probe-${{ matrix.os }}.txt
          if-no-files-found: error
