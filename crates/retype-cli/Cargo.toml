[package]
name = "retype-cli"
description = "Command line client and daemon for retype"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "retype_cli"
path = "src/lib.rs"

[[bin]]
name = "retype"
path = "src/main.rs"

[dependencies]
clap.workspace = true
getrandom.workspace = true
retype-core = { path = "../retype-core" }
retype-ipc = { path = "../retype-ipc" }
retype-watch = { path = "../retype-watch" }
serde_json.workspace = true
toml.workspace = true
tempfile = "3"
thiserror.workspace = true
clap_complete = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Storage_FileSystem",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_System_IO",
	"Win32_System_Pipes",
] }

[dev-dependencies]
ed25519-dalek.workspace = true
flate2 = "1.1.10"
tar = "0.4.46"
zip = { version = "5.1.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
